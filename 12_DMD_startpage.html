<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DMD-startpage</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&family=Sansation:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&display=swap" rel="stylesheet">
    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            overflow-x: hidden;
            background: #0a0a1a;
        }

        .DMD-section {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(180deg, #0a0a1a 0%, #1a1a3e 50%, #2d1b4e 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .stars {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: white;
            border-radius: 50%;
            animation: twinkle 3s infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        .moon-orbit {   /*moon orbit path*/
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            pointer-events: none;
            z-index: 5;
        }

        .moon-phase {
            position: absolute;
            width: 120px;
            height: 120px;
            transition: all 0.3s ease-out;
            filter: drop-shadow(0 0 20px rgba(216, 151, 238, 0.5));
        }

        .moon-phase img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .DMD-content {
            position: relative;
            z-index: 10;
            text-align: center;
            max-width: 800px;
            padding: 0 40px;
        }

        .main-title {
            font-size: 80px;
            font-family: 'Sansation', sans-serif;
            font-weight: 300;
            font-style: italic;
            background: linear-gradient(135deg, #ffffff 0%, #e8e8ff 30%, #d0c8ff 60%, #b8a8ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
            letter-spacing: 2px;
            line-height: 1.2;
            animation: fadeInDown 1s ease-out 0.2s both;
        }

        .subtitle {
            font-size: 20px;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 40px;
            letter-spacing: 3px;
            animation: fadeInDown 1s ease-out 0.4s both;
        }

        .diary-highlight {  /*당신만의 다이어리*/
            display: inline-flex;
            align-items: center;
            gap: 15px;
            font-size: 28px;
            font-weight: 400;
            color: #ffffff;
            margin-bottom: 30px;
            padding: 20px 40px;
            background: linear-gradient(135deg, rgba(157, 117, 255, 0.2), rgba(124, 92, 219, 0.3));
            border-radius: 50px;
            border: 2px solid rgba(157, 117, 255, 0.4);
            animation: fadeIn 1s ease-out 0.7s both, pulse 1.5s ease-in-out infinite;
        }

        .diary-icon {
            font-size: 32px;
            animation: bookFlip 5s ease-in-out infinite;
        }

        @keyframes bookFlip {
            0%, 100% { transform: rotateY(0deg); }
            50% { transform: rotateY(180deg); }
        }

        @keyframes pulse {
            0%, 100% {
                box-shadow: 0 0 20px rgba(157, 117, 255, 0.4);
            }
            50% {
                box-shadow: 0 0 40px rgba(157, 117, 255, 0.6);
            }
        }

        .row-buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
            animation: fadeInUp 1s ease-out 0.8s both;
        }

        .row-btn {
            padding: 18px 40px;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 700;
            font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }

        .row-btn.primary {
            background: linear-gradient(135deg, #9d75ff, #a9a6fa);
            color: white;
            box-shadow: 0 8px 24px rgba(157, 117, 255, 0.4);
        }

        .row-btn.primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 32px rgba(157, 117, 255, 0.6);
        }

        .row-btn.secondary {
            background: transparent;
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        .row-btn.secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.5);
            transform: translateY(-3px);
        }

        /* Floating Elements */
        .floating-element {
            position: absolute;
            pointer-events: none;
            opacity: 0.6;
        }

        .floating-element.book {
            font-size: 40px;
            animation: float 8s ease-in-out infinite;
        }

        .floating-element.pen {
            font-size: 35px;
            animation: float 7s ease-in-out infinite 1s;
        }

        .floating-element.star {
            font-size: 30px;
            animation: float 6s ease-in-out infinite 2s;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0px) rotate(0deg);
            }
            50% {
                transform: translateY(-30px) rotate(10deg);
            }
        }

        .scroll-indicator { /*아래 페이지로 내려가는 버튼*/
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            animation: bounce 2s infinite;
            cursor: pointer;
            z-index: 10;
        }

        .scroll-indicator svg {
            width: 30px;
            height: 30px;
            color: rgba(255, 255, 255, 0.6);
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {
                transform: translateX(-50%) translateY(0);
            }
            40% {
                transform: translateX(-50%) translateY(-10px);
            }
            60% {
                transform: translateX(-50%) translateY(-5px);
            }
        }

        /*아래 페이지*/
        .second-section {
            width: 100vw;
            min-height: 100vh;
            background: linear-gradient(180deg, #2d1b4e 0%, #1a1a3e 50%, #0a0a1a 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* Animations */
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /*반응형*/
        /*TODO: 반응형 웹 불필요한지 물어볼 것!*/
        @media screen and (max-width: 768px) {
            .main-title {
                font-size: 36px;
            }

            .subtitle {
                font-size: 16px;
                letter-spacing: 2px;
            }

            .description {
                font-size: 16px;
            }

            .diary-highlight {
                font-size: 20px;
                padding: 15px 30px;
            }

            .diary-icon {
                font-size: 24px;
            }

            .row-buttons {
                flex-direction: column;
            }

            .row-btn {
                width: 100%;
                justify-content: center;
            }

            .floating-element {
                display: none;
            }

            .moon-phase {
                width: 80px;
                height: 80px;
            }
        }

        @media screen and (max-width: 480px) {
            .main-title {
                font-size: 28px;
            }

            .moon-phase {
                width: 60px;
                height: 60px;
            }
        }
    </style>
</head>
<body>
    <section class="DMD-section" id="DMDSection">
        <!-- Animated Stars -->
        <div class="stars" id="starsContainer"></div>

        <div class="moon-orbit" id="moonOrbit">
            <div class="moon-phase" id="moonPhase">
                <img src="https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f311.svg" alt="Moon Phase" id="moonImage">
            </div>
        </div>

        <!-- Floating Elements -->
        <div class="floating-element book" style="top: 20%; left: 15%;">📖</div>
        <div class="floating-element pen" style="top: 30%; right: 20%;">✒️</div>
        <div class="floating-element star" style="bottom: 25%; left: 10%;">✨</div>
        <div class="floating-element book" style="bottom: 20%; right: 15%;">📔</div>

        <!-- Content -->
        <div class="DMD-content">
            <h1 class="main-title">Day<br>Month<br>Diary</h1>
            <p class="subtitle">매일 매달 남기는 나만의 기록</p>

            <div class="diary-highlight">
                <span class="diary-icon">📔</span>
                <span>당신만의 다이어리</span>
            </div>

            <div class="row-buttons">
                <button class="row-btn primary" onclick="startJourney()">
                    <span>여정 시작하기</span>
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M7.5 15L12.5 10L7.5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
                <button class="row-btn secondary" onclick="learnMore()">
                    <span>더 알아보기</span>
                </button>
            </div>
        </div>

        <!-- Scroll Indicator -->
        <div class="scroll-indicator" onclick="scrollToNext()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
        </div>
    </section>

    <!-- Second Section (Empty for now) -->
    <section class="second-section" id="secondSection">
        <div class="stars" id="starsContainer2"></div>
        <!-- Content will be added here later -->
    </section>

    <script>
        const moonPhases = [
            'https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f311.svg', // 🌑
            'https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f312.svg', // 🌒
            'https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f313.svg', // 🌓
            'https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f314.svg', // 🌔
            'https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f315.svg', // 🌕
            'https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f316.svg', // 🌖
            'https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f317.svg', // 🌗
            'https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f318.svg', // 🌘
            'https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f311.svg', // 🌑
            'https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f312.svg', // 🌒
            'https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f313.svg', // 🌓
            'https://cdn.jsdelivr.net/gh/twitter/twemoji@14.0.2/assets/svg/1f314.svg', // 🌔
        ];

        let currentScrollPosition = 0;
        const moonPhase = document.getElementById('moonPhase');
        const moonImage = document.getElementById('moonImage');

        function createStars(containerId) {
            const starsContainer = document.getElementById(containerId);
            const starCount = 250;

            for (let i = 0; i < starCount; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDelay = Math.random() * 3 + 's';
                star.style.opacity = Math.random() * 0.7 + 0.3;
                starsContainer.appendChild(star);
            }
        }

        function updateMoonPosition() {
            const scrollY = window.scrollY;
            const windowHeight = window.innerHeight;
            const maxScroll = windowHeight;
            
            const progress = Math.min(scrollY / maxScroll, 1);
            
            const startX = 50;
            const endX = window.innerWidth - 150;
            const centerY = windowHeight / 2;
            
            const x = startX + (endX - startX) * progress;
            
            const arcHeight = windowHeight * 0.3;
            const y = centerY - Math.sin(progress * Math.PI) * arcHeight;
            
            moonPhase.style.left = x + 'px';
            moonPhase.style.top = y + 'px';
            
            const phaseIndex = Math.floor(progress * 11);
            moonImage.src = moonPhases[phaseIndex];
            
            if (scrollY > maxScroll * 0.8) {
                const fadeProgress = (scrollY - maxScroll * 0.8) / (maxScroll * 0.2);
                moonPhase.style.opacity = 1 - fadeProgress;
            } else {
                moonPhase.style.opacity = 1;
            }
        }

        window.addEventListener('scroll', updateMoonPosition);

        function scrollToNext() {
            const secondSection = document.getElementById('secondSection');
            secondSection.scrollIntoView({ behavior: 'smooth' });
        }

        function startJourney() {
            window.location.href = './pages/12_Orbit_home.html';
        }

        function learnMore() {
            scrollToNext();
        }

        createStars('starsContainer');
        createStars('starsContainer2');
        updateMoonPosition();

        window.addEventListener('load', () => {
            document.body.style.opacity = '1';
        });
    </script>
</body>
</html>
