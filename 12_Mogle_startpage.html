<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>시작 화면-Mogle</title>
    <link rel="stylesheet" href="./css/12_Mogle_style.css">
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }

        .background-decorations {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .bg-star {
            position: absolute;
            width: 70%; 
            height: 70%;
            
            left: 25%; 
            top: 0%; 
            transform: rotate(1deg);
            opacity: 1; 
            background-image: url("./content/12_시작화면배경별.png"); 
            background-repeat: no-repeat; 
            background-size: contain;
        }

        .bg-clover {
            position: absolute;
            width: 80%; 
            height: 80%;
            
            left: 0%; 
            top: 20%; 
            
            opacity: 1; 
            background-image: url("./content/12_시작화면배경클로버.png");
            background-repeat: no-repeat;
            background-size: contain;
        }

        .bg-sparkle {
            position: absolute;
            width: 60%; 
            height: 60%;
            
            left: 31%; 
            top: 40%; 
            
            opacity: 1;
            background-image: url("./content/12_시작화면배경반짝별.png");
            background-repeat: no-repeat;
            background-size: contain;
        }

        .layout {
            display: flex;
            height: 100vh;
            align-items: center;
            justify-content: space-between;
            padding: 0 120px;
            box-sizing: border-box;
            position: relative;
            z-index: 1;
        }

        .left-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .logo {
            font-size: var(--font-super-large);
            margin: 0;
            line-height: 1;
            letter-spacing: 2px;
            text-shadow: var(--text-shadow);
        }

        .subtitle {
            font-size: var(--font-very-large);
            margin: 0;
            text-align: center;
            text-shadow: var(--text-shadow);
        }

        .subtitle-small {
            font-size: var(--font-medium-small);
            text-shadow: var(--text-shadow);
        }

        .right-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            max-width: 550px;
        }

        .signin-title {
            font-size: var(--font-very-large);
            margin: 0 0 30px 0;
            align-self: flex-start;
            width: 100%;
            padding-bottom: 10px;
            border-bottom: 3px solid var(--star-blue);
        }

        .input-group {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .btn-gradient {
            width: 100%;
            font-size: var(--font-medium-small);
            opacity: 0.8;
        }

        .signup-link {
            width: 100%;
            text-align: center;
            margin-top: 20px;
            padding-top: 20px;
            font-size: var(--font-small);
            border-top: 3px solid var(--sparkle-pink);
        }

        .signup-link p {
            margin: 0;
            color: #000;
            letter-spacing: 1px;
        }

        .underline-pink {
            text-decoration: underline wavy;
            text-decoration-color: var(--sparkle-pink);
            text-decoration-thickness: 15%;
            text-underline-offset: 20%;
        }

    </style>
</head>
<body>
    <div class="background-decorations">
        <div class="bg-star"></div>
        <div class="bg-clover"></div>
        <div class="bg-sparkle"></div>
    </div>

    <div class="layout">
        <div class="left-section">
            <h1 class="logo">Mogle</h1>
            <p class="subtitle">모<span class="subtitle-small">여서 쓰는</span> 글</p>
        </div>

        <div class="right-section">
            <h2 class="signin-title">Sign In?</h2>
            <div class="input-group">
                <input type="text" class="input-basic" placeholder="아이디를 입력하세요.">
                <input type="password" class="input-basic" placeholder="비밀 번호를 입력하세요.">
                <button class="btn-gradient soda"><a href="./pages/12_Mogle_home.html">Sign In</a></button>
            </div>
            <div class="signup-link">
                <p>Mogle로 친구들과 <span class="underline-pink">추억을 공유</span>하고 싶다면 &gt;</p>
            </div>
            <button class="btn-gradient cloud"><a href="./pages/12_Mogle_signup.html">Sign Up</a></button>
        </div>
    </div>
</body>
</html>
