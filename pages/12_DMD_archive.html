<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DMD-archive</title>
    <link rel="stylesheet" href="../css/12_DMD_style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&family=Sansation:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">
    <style>
    @import url('https://fonts.googleapis.com/css2?family=Gowun+Batang&display=swap');

    .sidebar-icon {
            width: 24px;
            height: 24px;
            stroke: var(--color-text-secondary);
            fill: none;
            stroke-width: 2;
        }

        .main-content {
            padding: 60px 160px;
        }
        .archive-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 60px;
        }

        .search-bar {
            position: relative;
            width: 400px;
        }

        .search-bar input {
            width: 100%;
            padding: 12px 16px 12px 44px;
            background: var(--gradient-button-transperant);
            border: 1px solid var(--border-secondary);
            border-radius: 12px;
            color: var(--color-text-primary);
            font-size: 14px;
            font-family: "Noto Sans KR", sans-serif;
            outline: none;
            transition: all 0.3s;
        }

        .search-bar input:focus {
            border-color: var(--border-primary);
            box-shadow: 0 0 20px var(--shadow-glow);
        }

        .search-bar input::placeholder {
            color: var(--color-text-muted);
        }

        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            stroke: var(--color-text-muted);
        }

        .date-selectors {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .custom-select {
            position: relative;
            min-width: 120px;
        }

        .select-trigger {
            padding: 8px 16px;
            background: var(--gradient-button-transperant);
            border: 1px solid var(--border-secondary);
            border-radius: 10px;
            color: var(--color-text-primary);
            font-size: 14px;
            font-family: "Noto Sans KR", sans-serif;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            user-select: none;
        }

        .select-trigger:hover {
            border-color: var(--border-primary);
            background: var(--color-accent-purple);
        }

        .custom-select.active .select-trigger {
            border-color: var(--border-primary);
            box-shadow: 0 0 15px var(--shadow-glow);
        }

        .select-arrow {
            transition: transform 0.3s;
            flex-shrink: 0;
        }

        .custom-select.active .select-arrow {
            transform: rotate(180deg);
        }

        .select-dropdown {
            position: absolute;
            top: calc(100% + 4px);
            left: 0;
            right: 0;
            background: var(--gradient-button-transperant);
            border: 1px solid var(--border-primary);
            border-radius: 12px;
            max-height: 250px;
            overflow-y: auto;
            opacity: 0;
            visibility: hidden;
            transform: translateY(-10px);
            transition: all 0.3s;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .custom-select.active .select-dropdown {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .select-option {
            padding: 10px 16px;
            color: var(--color-text-secondary);
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .select-option:first-child {
            border-radius: 12px 12px 0 0;
        }

        .select-option:last-child {
            border-radius: 0 0 12px 12px;
        }

        .select-option:hover {
            background: var(--color-accent-purple);
            color: var(--color-text-primary);
        }

        .select-option.selected {
            background: var(--color-accent-purple-dark);
            color: var(--color-text-primary);
        }

        .select-dropdown::-webkit-scrollbar {
            width: 6px;
        }

        .select-dropdown::-webkit-scrollbar-track {
            background: transparent;
        }

        .select-dropdown::-webkit-scrollbar-thumb {
            background: var(--border-secondary);
            border-radius: 3px;
        }

        .select-dropdown::-webkit-scrollbar-thumb:hover {
            background: var(--border-primary);
        }

        .diary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); 
            gap: 20px;
            margin-bottom: 40px;
        }

        .diary-card {
            position: relative;
            background: var(--gradient-button-semitrans);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-light);
            border-radius: 24px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 190px;
            overflow: hidden;
        }

        .diary-card:hover {
            transform: translateY(-4px);
            border-color: var(--color-primary-light);
            box-shadow: 0 5px 10px var(--shadow-primary)
        }

        .diary-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 6px;
            width: 2px;
            height: 100%;
            background: var(--gradient-text-title);
            opacity: 0.7;
            transition: opacity 0.3s;
        }

        .diary-date-group {
            display: flex;
            align-items: baseline;
            gap: 8px;
            margin-bottom: 8px;
            color: var(--color-primary-lightest);
        }

        .diary-date {
            font-family: 'Gowun Batang', sans-serif;
            font-size: 24px;
            line-height: 1;
            background: var(--gradient-text-main);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .diary-title {
            font-family: 'Gowun Batang', serif;
            font-size: 19px;
            font-weight: 400;
            color: var(--color-text-primary);
            margin-bottom: 10px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .diary-preview {
            font-family: 'Noto Sans KR', sans-serif;
            font-size: 13px;
            color: var(--color-text-tertiary);
            line-height: 1.6; 
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
            max-height: 3em;
            margin-bottom: auto;
        }

        .diary-footer {
            margin-top: 15px;
            display: flex;
            justify-content: flex-end;
            opacity: 0.6;
            transition: opacity 0.3s;
        }

        .diary-card:hover .diary-footer {
            opacity: 1;
            color: var(--color-primary-light);
        }

        .no-results {
            text-align: center;
            padding: 10px;
            color: var(--color-text-muted);
            font-size: 16px;
        }

        @media (max-width: 1400px) {
            .diary-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        @media (max-width: 1100px) {
            .diary-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 800px) {
            .diary-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .archive-controls {
                flex-direction: column;
                gap: 20px;
                align-items: stretch;
            }
            
            .search-bar {
                width: 100%;
            }
        }
    </style>
</head>


<body>
    <div class="sidebar">
        <div class="sidebar-icon-wrapper" onclick="location.href='12_DMD_home.html'">
            <img src="../content/12_DMD_Columns.svg" class="sidebar-icon">
            <div class="sidebar-tooltip">책장</div>
        </div>
        <div class="sidebar-icon-wrapper" onclick="location.href='12_DMD_calendar.html'">
            <img src="../content/12_DMD_Calendar.svg" class="sidebar-icon">
            <div class="sidebar-tooltip">캘린더</div>
        </div>
        <div class="sidebar-icon-wrapper">
            <img src="../content/12_DMD_Layers.svg" class="sidebar-icon active">
            <div class="sidebar-tooltip">아카이브</div>
        </div>
    </div>

    <div class="header">
        <div class="logo">
            <a href="12_DMD_home.html" style="display: inline-flex; align-items: center; text-decoration: none;">
                <img src="../content/12_DMD_logo.png" class="logo-icon">
                <span>Day Month Diary</span>
            </a>
        </div>

        <div class="header-right">
            <div class="profile-btn">
                <div class="profile-avatar">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                        <circle cx="12" cy="7" r="4"/>
                    </svg>
                </div>
                <svg class="chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="6 9 12 15 18 9"/>
                </svg>
            </div>


            <div class="user-info-popup" id="userInfoPopup">
                <button class="popup-close">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>

                <div class="popup-email"></div>
                <div class="popup-avatar-wrapper">
                    <div class="popup-avatar">
                        <svg width="40" height="40" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                            <circle cx="12" cy="7" r="4"/>
                        </svg>
                    </div>
                    <div class="camera-badge">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
                            <circle cx="12" cy="13" r="4"/>
                        </svg>
                    </div>
                </div>

                <div class="popup-greeting"></div>
                
                <button class="logout-btn">로그아웃</button>
                <input type="file" id="profileImageInput" style="display: none;" accept="image/*">
            </div>



        </div>
    </div>

    <div class="main-content">
        <div class="archive-controls">
            <div class="search-bar">
                <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"/>
                    <path d="m21 21-4.35-4.35"/>
                </svg>
                <input type="text" id="searchInput" placeholder="다이어리 이름으로 검색">
            </div>
            <div class="date-selectors">
                <div class="custom-select" id="yearSelector">
                    <div class="select-trigger">
                        <span class="select-value">년도 선택</span>
                        <svg class="select-arrow" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="6 9 12 15 18 9"/>
                        </svg>
                    </div>
                    <div class="select-dropdown">
                        <div class="select-option" data-value="">년도 선택</div>
                    </div>
                </div>
                <div class="custom-select" id="monthSelector">
                    <div class="select-trigger">
                        <span class="select-value">월 선택</span>
                        <svg class="select-arrow" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="6 9 12 15 18 9"/>
                        </svg>
                    </div>
                    <div class="select-dropdown">
                        <div class="select-option" data-value="">월 선택</div>
                        <div class="select-option" data-value="1">1월</div>
                        <div class="select-option" data-value="2">2월</div>
                        <div class="select-option" data-value="3">3월</div>
                        <div class="select-option" data-value="4">4월</div>
                        <div class="select-option" data-value="5">5월</div>
                        <div class="select-option" data-value="6">6월</div>
                        <div class="select-option" data-value="7">7월</div>
                        <div class="select-option" data-value="8">8월</div>
                        <div class="select-option" data-value="9">9월</div>
                        <div class="select-option" data-value="10">10월</div>
                        <div class="select-option" data-value="11">11월</div>
                        <div class="select-option" data-value="12">12월</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="diary-grid" id="diaryGrid"></div>
    </div>

    <script src="../JS/12_DMD_dummy_data.js"></script>
    <script src="../JS/12_DMD_popup.js"></script>
    <script src="../JS/12_DMD_common_background.js"></script>
    <script src="../JS/12_DMD_archive.js"></script>
</body>
</html>
